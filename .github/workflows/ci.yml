name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: corepack yarn run audit:critical
      - run: yarn run check
      - run: yarn run test:extract
